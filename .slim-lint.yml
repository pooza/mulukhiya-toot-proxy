# Slim テンプレートの lint 設定。
#
# ⚠ 2026-09-16（#4578）まで、この lint は `views/` 直下の 16 本を一度も検査していなかった。
# `rake slim:lint` がシェルの `views/**/*.slim` に頼っており、dash には globstar が無いので
# `views/*/*.slim` と等価になっていたため。⚠⚠ **それでも `rake lint` は緑で通っていた。**
# 実体は app/task/slim.rb 側で直してある。
linters:
  # ⚠⚠ **切っているのは「実態に合っていない閾値を掲げない」ため**（#4578 の判断・2026-09-16）。
  # 全 22 本を検査対象に戻した時点で、既定の 80 字に対し 201 行、Ruby 側と同じ 100 字でも
  # 113 行が超過する。⚠ 中身は **Vue のディレクティブを並べた属性行**
  # （`:class` / `@click` / `v-if` / `v-tooltip` が 1 タグに 5 個以上付く）で、
  # Slim で折り返すと構造がかえって読めなくなる。
  # ⚠ **「誰も守らない数字」を置くと #4578 と同じ「守れているつもりの緑」に戻る**ので、
  # 数字を下げて見かけを整えるのではなく、明示的に切って理由を残す。
  # 🔴 **Ruby コード側の `Layout/LineLength: Max: 100`（ginseng-style）はこの判断の対象外。**
  LineLength:
    enabled: false
