version: 2
updates:
# ⚠⚠ **v4 系は据え置き（limit 0 ＝ version update 無効）。**
# 保守は「必要なものだけバックポート」の方針なので、日次で PR が出ても捌けない。
# ⚠ security update は limit 0 でも動くので、脆弱性の通知は止まらない。
- package-ecosystem: bundler
  directory: '/'
  schedule:
    interval: daily
    time: '03:00'
    timezone: 'Asia/Tokyo'
  open-pull-requests-limit: 0
  target-branch: v4
  versioning-strategy: lockfile-only
# ⚠⚠ **develop は version update を開けている。ただし `ginseng-*` は対象外 (#4702)。**
# ginseng の版上げは、同期手順（docs/CLAUDE.md §6-1）でずれを拾い、gem ごとに
# 「すぐ / 次のマイルストーン / 見送り」を決めて Issue にする。dependabot の PR は
# その判断（どの版を・どの回で）を持てないので、**二重になるか、判断とずれて閉じるか**の
# どちらかにしかならなかった（2026-09-24 の PR #4752 は版も宛先もずれていた）。
#
# ⚠ `allow:` で絞ってはいけない。`allow` は **security update にも効く**ので、
# 他の gem の脆弱性 PR まで止まる。**止めるのは下の `ignore` で行う**（version update にだけ効く）。
- package-ecosystem: bundler
  directory: '/'
  schedule:
    interval: daily
    time: '03:00'
    timezone: 'Asia/Tokyo'
  # ⚠ `others` グループの 1 本ぶん。
  open-pull-requests-limit: 1
  target-branch: develop
  # `increase-if-necessary` は **今の制約を満たさない版のときだけ** manifest を動かす。
  # （ginseng のタグを上げるために入れた設定。ginseng を外した後も実害が無いので据え置き）
  # ⚠ ただしそれでは、**意図して上限を置いている gem まで制約を広げる PR が出る**。
  # そこで下の `ignore` で、上限の外へ出る版上げだけを止める（据え置きの判断は Issue で行う）。
  # ⚠ `ignore` は version update にだけ効き、**security update は止めない**。
  versioning-strategy: increase-if-necessary
  # ⚠⚠ **`Gemfile` の `~>` と対にしてある。**上限を足した・外したら、ここも直す
  # （`test/unit/lib/dependabot_config.rb` がずれを捕まえる）。
  #   `~> X.Y`   → 上限の外は major       → major を止める
  #   `~> X.Y.Z` → 上限の外は minor 以上  → minor と major を止める
  ignore:
    # #4702: ginseng-* は同期手順で gem ごとに判断する（上のコメント）
    - dependency-name: 'ginseng-*'
    # #4699: json 3.0 はリリース翌日のメジャー。harness ＋ステージングで実走してから上げる
    - dependency-name: json
      update-types: ['version-update:semver-major']
    # #4663 / #4678: 2026-02 の同時アクセステストを通った版。上げる判断は実測で行う
    - dependency-name: rack
      update-types: ['version-update:semver-major', 'version-update:semver-minor']
    # 🔴 事故版は 4.2.0。4.2.1 は本番 4 台で無事故（#4508）
    - dependency-name: sinatra
      update-types: ['version-update:semver-major', 'version-update:semver-minor']
    # #4772: CVE-2026-80212 / 80213 のホットフィックス。Ruby 4.0.7 同梱と同じ 0.7.x に留める
    - dependency-name: resolv
      update-types: ['version-update:semver-major', 'version-update:semver-minor']
    - dependency-name: sidekiq-scheduler
      update-types: ['version-update:semver-major', 'version-update:semver-minor']
    - dependency-name: parallel
      update-types: ['version-update:semver-major']
    - dependency-name: puma
      update-types: ['version-update:semver-major']
    - dependency-name: sidekiq
      update-types: ['version-update:semver-major']
  groups:
    # ginseng 以外はまとめて 1 本。⚠ 上の `ignore` があるので、**上限を置いた gem の
    # 制約は動かない**（上限の内側の版上げは `Gemfile.lock` だけが上がる）。
    others:
      patterns:
        - '*'
      exclude-patterns:
        - 'ginseng-*'
