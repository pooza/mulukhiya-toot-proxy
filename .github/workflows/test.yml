name: test
on:
  - push
env:
  CI: 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.8
      - name: apt install
        run: |
          sudo apt update
          sudo apt install ffmpeg
          sudo apt install libpq-dev
          sudo apt install libidn11-dev
          sudo apt install libvips-dev
      - name: bundle install
        run: |
          gem install bundler -v '~>2.0'
          # ⚠ lock を尊重する（#4737）。以前は `rake bundle:update` で毎回すべての gem を
          # 最新へ動かしていたが、4.x は Dependabot のアラート時にまとめて上げる運用で、
          # 引数なしの bundle update は json 3.x など検証していない版を掴んで CI を壊す。
          bundle install --jobs 4 --retry 3
          bundle exec rake bundle:check
      - name: Run lint
        run: |
          bundle exec rake lint
