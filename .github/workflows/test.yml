name: test
on:
  - push
env:
  CI: 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # omission_baseline は「CI（実サーバー非保持）で omission になるテストの
        # 上限件数」。CI には SNS も Mastodon の Postgres も無いため、アカウント依存の
        # テストは実行されず omission になる。この件数が黙って増えると
        # 「守れているつもりの緑」が広がるので、超えたら CI を落とす (#4503)。
        # 意図してテストを増やしたときは、この数値を実測に合わせて更新する。
        include:
          - controller: mastodon
            omission_baseline: 321
          - controller: misskey
            omission_baseline: 310
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: apt install
        run: |
          sudo apt update
          sudo apt install ffmpeg
          sudo apt install libidn11-dev
          sudo apt install libvips-dev
      - name: Fix gem directory permissions
        run: chmod -R o-w "$(gem environment gemdir)"
      - name: Create CI config
        run: |
          printf "controller: ${{ matrix.controller }}\ncrypt:\n  password: ci_dummy_password\n${{ matrix.controller }}:\n  url: https://ci.example.com\nhandler:\n  group_tag:\n    sources: []\n" > config/local.yaml
      - name: bundle install
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
          bundle exec rake bundle:update
          git diff
          bundle exec rake bundle:check
      - name: Run lint
        run: |
          bundle exec rake lint
      - name: Run test (${{ matrix.controller }})
        id: test
        run: |
          set -o pipefail
          bundle exec rake test 2>&1 | tee test-result.log
      - name: Report omissions (${{ matrix.controller }})
        if: always()
        env:
          BASELINE: ${{ matrix.omission_baseline }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          # 集計できないときは fail closed (#4559)。test-unit がサマリの書式を
          # 変えただけでラチェットが黙って無効化されると、#4503 で塞いだ
          # 「守れているつもりの緑」がそのまま戻る。
          # ⚠ テスト自体が落ちている run では既にジョブが赤なので追撃しない。
          abort_unless_test_failed () {
            if [ "$TEST_OUTCOME" != "success" ]; then
              echo "::warning::$1（テストが失敗しているため、ここでは落とさない）"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }
          if [ ! -f test-result.log ]; then
            abort_unless_test_failed "テスト結果のログが無いため omission を集計できません"
          fi
          summary="$(grep -E '^[0-9]+ tests, ' test-result.log | tail -1 || true)"
          omissions="$(printf '%s' "$summary" | sed -nE 's/.*, ([0-9]+) omissions.*/\1/p')"
          {
            echo "## ${{ matrix.controller }}"
            echo
            echo '```'
            echo "${summary:-集計行が見つかりませんでした}"
            echo '```'
            echo
            echo "CI は実サーバー（SNS + Mastodon の Postgres）を持たないため、"
            echo "**アカウント依存のテストは実行されず omission になる（${omissions:-?} 件 / 上限 ${BASELINE}）。**"
            echo "test-unit はこの状態でも \`100% passed\` と出すので、**CI の緑だけをリリース判断の根拠にできない**。"
            echo "リリース前に chubo2 fedi-test-harness で実走し、Mastodon / Misskey 両系で"
            echo "0 failures / 0 errors を確認すること（手順は docs/test-harness.md、経緯は #4503）。"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$omissions" ]; then
            abort_unless_test_failed "omission 件数を集計できませんでした (集計行: ${summary:-なし})"
          fi
          if [ "$omissions" -gt "$BASELINE" ]; then
            echo "::error::omission が ${omissions} 件で上限 ${BASELINE} を超えました。実行されていないテストが増えています (#4503)"
            exit 1
          fi
          echo "::notice::omission ${omissions} 件 / 上限 ${BASELINE}"
