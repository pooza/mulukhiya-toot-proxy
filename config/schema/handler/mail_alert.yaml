label: メールアラート
description: エラー発生時にメールでアラートを送信します
properties:
  disabled:
    type: boolean
  sendmail_bin:
    type: string
  timeout:
    minimum: 1
    type: integer
  to:
    # ⚠ **`format: email` は json-schema に検証実装が無く素通しだった (#4597)。**
    # `not-an-email` も `@` も `a b@c` も通っていた。⚠ RFC 5322 を厳密に書くのは
    # 不毛なので、**typo を落とせる最小限**（空白なし・`@` が 1 つ・ドメインに `.`）に絞る。
    # ⚠ `^` / `$` ではなく `\A` / `\z`（行ごとに一致するので複数行の値が通る）。
    pattern: '\A[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+\z'
    type: string
required:
  - to
type: object
